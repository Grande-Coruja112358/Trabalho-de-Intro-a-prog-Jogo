<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Crônicas do Reino - RPG</title>
    <style>
        body {
            background-color: #121212;
            color: #e0d8c3;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 3.5rem;
            color: #d4af37;
            text-shadow: 2px 2px 8px #000000;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #a89f8c;
            margin-bottom: 40px;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 260px;
        }
        a {
            background-color: #26211d;
            color: #d4af37;
            text-decoration: none;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            border: 2px solid #5c4b37;
            border-radius: 4px;
            transition: 0.2s;
        }
        a:hover {
            background-color: #3d342b;
            border-color: #d4af37;
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <h1>CRÔNICAS DO REINO</h1>
    <p>Sua jornada começa nas sombras...</p>
    
    <div class="menu">
        <a href="/novo-jogo">Novo Jogo</a>
        <a href="/carregar">Carregar Aventura</a>
        <a href="/creditos">Créditos</a>
    </div>
</body>
</html>
